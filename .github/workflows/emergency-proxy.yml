name: Emergency 6-Hour Proxy Server

on:
  workflow_dispatch: 

jobs:
  run-proxy:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Verify Tailscale Secret
      run: |
        if ( "${{ secrets.TAILSCALE_AUTH_KEY }}" -eq "" ) { Write-Error "Missing TAILSCALE_AUTH_KEY in GitHub Secrets!" ; exit 1 }

    - name: Connect to Tailscale Network
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        args: --accept-routes=true

    - name: Deploy and Configure Authenticated Proxy
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-windows-amd64-2.11.5.zip" -OutFile "gost.zip"
        Expand-Archive -Path "gost.zip" -DestinationPath "gost" -Force
        if (Test-Path ".\gost\gost-windows-amd64.exe") { Rename-Item ".\gost\gost-windows-amd64-2.11.5.exe" "gost.exe" }
        if (Test-Path ".\gost\gost-windows-amd64.exe") { Rename-Item ".\gost\gost-windows-amd64.exe" "gost.exe" }
        
        $ProxyUser = -join ((65..90) + (97..122) | Get-Random -Count 8 | ForEach-Object {[char]$_})
        $ProxyPass = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 12 | ForEach-Object {[char]$_})
        $ProxyPort = "8080"
        $TailscaleIP = (tailscale ip -4).Trim()
        
        Start-Process -FilePath ".\gost\gost.exe" -ArgumentList "-L=http://$($ProxyUser):$($ProxyPass)@:$ProxyPort", "-L=socks5://$($ProxyUser):$($ProxyPass)@:$ProxyPort" -WindowStyle Hidden
        
        Write-Host "`n=================================================================="
        Write-Host " YOUR EMERGENCY HIGH-SPEED PROXY IS READY!"
        Write-Host "=================================================================="
        Write-Host " SERVER IP (Tailscale): $TailscaleIP"
        Write-Host " PORT:                 $ProxyPort"
        Write-Host " USERNAME:             $ProxyUser"
        Write-Host " PASSWORD:             $ProxyPass"
        Write-Host "=================================================================="
        Write-Host " COPY-PASTE FOR SOCKS5 COMPATIBLE APPS:"
        Write-Host "socks5://$($ProxyUser):$($ProxyPass)@$($TailscaleIP):$ProxyPort"
        Write-Host "==================================================================`n"

    - name: Keep Alive (6 Hours)
      shell: powershell
      run: |
        Write-Host "Proxy is actively hosting internet. Keeping connection alive..."
        Start-Sleep -Seconds 21600

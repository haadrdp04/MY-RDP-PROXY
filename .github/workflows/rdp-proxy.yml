name: Windows-Native-RDP-Proxy
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Enable Windows RDP Built-in Feature
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      # 2. Set Password for runneradmin
      - name: Set RDP Password
        run: |
          net user runneradmin "MobileRDPPassword123!"

      # 3. Install Tailscale Silently via Winget
      - name: Install Tailscale Silently
        run: |
          winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements

      # 4. Connect to Tailscale (With Exit Node support enabled)
      - name: Connect to Tailscale as Exit Node
        run: |
          # Enable IP forwarding so traffic can pass through this machine
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name "IPEnableRouter" -Value 1

          # Connect to Tailscale with advertise-exit-node
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="windows-proxy-rdp" --advertise-exit-node --unattended --accept-routes

      # 5. Start Background Proxy Server (HTTP & SOCKS5)
      - name: Start Proxy Server
        run: |
          # Download lightweight proxy binary (GOST)
          curl.exe -sL "https://github.com/go-gost/gost/releases/download/v3.0.0-rc10/gost_3.0.0-rc10_windows_amd64.zip" -o gost.zip
          tar.exe -xf gost.zip
          
          # Run proxy listening on 8080 (HTTP) and 1080 (SOCKS5)
          Start-Process -FilePath ".\gost.exe" -ArgumentList "-L :8080 -L socks5://:1080" -WindowStyle Hidden

      # 6. Show IP Details, Proxy Credentials & Keep Alive
      - name: Keep Server Alive
        run: |
          $tsIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()

          Write-Host ""
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host "       WINDOWS RDP + PROXY + EXIT NODE IS LIVE!           " -ForegroundColor Green
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host " Tailscale IP : $tsIP" -ForegroundColor Yellow
          Write-Host ""
          Write-Host " [RDP CREDENTIALS]" -ForegroundColor Cyan
          Write-Host " Computer IP  : $tsIP"
          Write-Host " Username     : runneradmin"
          Write-Host " Password     : MobileRDPPassword123!"
          Write-Host ""
          Write-Host " [PROXY CREDENTIALS]" -ForegroundColor Cyan
          Write-Host " SOCKS5 Proxy : $tsIP:1080"
          Write-Host " HTTP Proxy   : $tsIP:8080"
          Write-Host ""
          Write-Host " [EXIT NODE (FULL VPN)]" -ForegroundColor Cyan
          Write-Host " Machine Name : windows-proxy-rdp"
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host ""

          Start-Sleep -Seconds 21600